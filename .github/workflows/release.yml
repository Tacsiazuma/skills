name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Never react to the bot's own bump commit (GitHub already skips [skip ci], this is a safety net).
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          current=$(jq -r '.metadata.version' .claude-plugin/marketplace.json)
          if ! [[ "$current" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Invalid metadata.version in marketplace.json: '$current'"
            exit 1
          fi
          next="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          tag="v$next"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null \
             || git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists; refusing to release over it."
            exit 1
          fi
          echo "Bumping $current -> $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Write version to marketplace and plugins
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bump() {
            local file=$1 filter=$2 tmp
            tmp=$(mktemp)
            jq --indent 2 --arg v "$VERSION" "$filter" "$file" > "$tmp"
            mv "$tmp" "$file"
          }
          bump .claude-plugin/marketplace.json '.metadata.version = $v'
          for f in plugins/*/.claude-plugin/plugin.json; do
            bump "$f" '.version = $v'
          done
          git diff --stat

      - name: Commit, tag and push
        id: commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json
          git commit -m "chore(release): $TAG [skip ci]"
          git tag "$TAG"
          git push origin HEAD:main
          git push origin "refs/tags/$TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: gh release create "$TAG" --generate-notes --title "$TAG" --target "$SHA"
